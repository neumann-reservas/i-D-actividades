<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Reportes de Actividades</title>
    
    <!-- Librerías CSS de Terceros -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

    <!-- Enlace a tu archivo de estilos local -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Contenido Principal de la Aplicación -->
    <div class="container-fluid my-4">
        <div class="card app-header p-3 mb-4">
            <h2 class="h3 mb-0 text-center fw-light">Dashboard de Reportes de Actividades</h2>
        </div>
        
        <!-- Panel de Resumen (Dashboard) -->
        <div class="row mb-4">
            <div class="col-md-4 mb-3 mb-md-0"><div class="card p-3 stat-card"><div class="icon mb-2"><i class="fas fa-file-alt"></i></div><div id="totalReports" class="stat-number">0</div><div class="stat-label">Reportes Totales</div></div></div>
            <div class="col-md-4 mb-3 mb-md-0"><div class="card p-3 stat-card"><div class="icon mb-2"><i class="fas fa-calendar-day"></i></div><div id="todayReports" class="stat-number">0</div><div class="stat-label">Reportes de Hoy</div></div></div>
            <div class="col-md-4"><div class="card p-3 stat-card"><div class="icon mb-2"><i class="fas fa-user-check"></i></div><div id="executivesCount" class="stat-number">0</div><div class="stat-label">Ejecutivos Activos</div></div></div>
        </div>

        <!-- Tarjeta Principal con Filtros y Tabla -->
        <div class="card">
            <div class="card-body">
                <div class="action-bar mb-3 d-flex flex-wrap gap-2">
                    <button class="btn btn-primary" type="button" data-bs-toggle="modal" data-bs-target="#reportModal"><i class="fas fa-plus me-1"></i> Nuevo Reporte</button>
                    <button class="btn btn-success" type="button" id="sendConsolidatedReportBtn"><i class="fas fa-envelope me-1"></i> Enviar Reporte Consolidado</button>
                </div>
                
                <div class="p-3 mb-4 rounded" style="background-color: #f8f9fa; border: 1px solid #dee2e6;">
                    <div class="row g-3 align-items-end">
                        <div class="col-lg-3 col-md-6"><label for="filterExecutive" class="form-label small">Filtrar por Ejecutivo</label><select id="filterExecutive" class="form-select"><option value="">Todos</option></select></div>
                        <div class="col-lg-3 col-md-6"><label for="filterStartDate" class="form-label small">Fecha Desde</label><input type="date" id="filterStartDate" class="form-control"></div>
                        <div class="col-lg-3 col-md-6"><label for="filterEndDate" class="form-label small">Fecha Hasta</label><input type="date" id="filterEndDate" class="form-control"></div>
                        <div class="col-lg-3 col-md-6 d-flex gap-2"><button id="applyFilters" class="btn btn-primary w-100"><i class="fas fa-filter me-1"></i> Aplicar</button><button id="clearFilters" class="btn btn-outline-secondary w-100"><i class="fas fa-times me-1"></i> Limpiar</button></div>
                    </div>
                </div>
                <div id="dataTableContainer" class="table-responsive"></div>
            </div>
        </div>
    </div>

    <!-- Modals -->
    
    <!-- Modal para Registrar Nuevo Reporte -->
    <div class="modal fade" id="reportModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Registrar Actividad Diaria</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="reportForm"><input type="hidden" id="formCargo">
                        <div class="row g-3">
                            <div class="col-md-6 mb-3"><label class="form-label">Ejecutivo</label><select id="formExecutive" class="form-select" required><option value="" selected disabled>Cargando...</option></select><small id="formCargoDisplay" class="text-muted"></small></div>
                            <div class="col-md-6 mb-3"><label class="form-label">Fecha de Actividades</label><input type="date" class="form-control" id="fechaReporte" required></div>
                            <div class="col-12 mb-3"><label class="form-label">Detalle de Actividades</label><div id="editor-container"></div></div>
                            <div class="col-12">
                                <label class="form-label">Adjuntar Capturas (Máx. 5)</label>
                                <div id="image-drop-zone" tabindex="0" class="p-4 text-center">
                                    <p class="mb-0 text-muted"><i class="fas fa-cloud-upload-alt fa-2x"></i></p>
                                    <p class="mb-0 text-muted small">Arrastra archivos o pega contenido aquí (Ctrl+V)</p>
                                </div>
                                <input type="file" id="imageUpload" multiple accept="image/*" class="d-none">
                                <div id="image-preview" class="mt-3"></div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" id="saveButton" class="btn btn-primary"><i class="fas fa-save me-1"></i> Guardar</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal de Spinner (Cargando...) -->
    <div class="modal fade" id="spinnerModal" tabindex="-1" data-bs-backdrop="static"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-body text-center py-5"><div class="spinner-border text-primary" style="width:3rem;height:3rem"></div><p class="mt-3 mb-0 fs-5">Procesando...</p></div></div></div></div>
    
    <!-- Modal para Ver Detalles del Reporte -->
    <div class="modal fade" id="detailModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="d-flex align-items-center w-100">
                        <i class="fas fa-user-circle fa-3x text-muted me-3"></i>
                        <div id="detailInfo">
                            <h6 id="detailEjecutivo"></h6>
                            <small class="text-muted" id="detailCargo"></small>
                        </div>
                        <div class="ms-auto text-end"><small id="detailFecha" class="text-muted"></small></div>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4 p-md-5">
                    <h4 id="detailSubject" class="mb-4"></h4>
                    <div id="detailBody" class="ql-snow"><div class="ql-editor"></div></div>
                    <hr class="my-4">
                    <!-- ¡NUEVA SECCIÓN DE COMENTARIOS! -->
                    <div id="detailCommentSection" style="display: none;">
                        <h6 class="mb-2"><i class="fas fa-comment-dots me-2"></i>Comentarios de Revisión</h6>
                        <p id="detailCommentText" class="p-3 rounded" style="background-color: #fffbe6; border-left: 4px solid #ffc107;"></p>
                        <hr class="my-4">
                    </div>
                    <h6 class="mb-3"><i class="fas fa-paperclip me-2"></i>Archivos Adjuntos</h6>
                    <div id="detailAttachments"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Librerías JavaScript -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Enlace a tu archivo de JavaScript local -->
    <script src="main.js"></script>
</body>
</html>

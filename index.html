<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Actividades Pro</title>
    
    <!-- Librerías CSS de Terceros -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tu archivo de estilos -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Contenedor Principal -->
    <div class="app-container">
        <!-- Encabezado Principal -->
        <header class="app-header">
            <h1 class="app-title">Reporte de Actividades</h1>
            <div class="app-actions">
                <button class="btn btn-outline-secondary" type="button" id="sendConsolidatedReportBtn"><i class="fas fa-paper-plane me-2"></i>Enviar Consolidado</button>
                <button class="btn btn-primary" type="button" data-bs-toggle="modal" data-bs-target="#reportModal"><i class="fas fa-plus me-2"></i>Nuevo Reporte</button>
            </div>
        </header>

        <main class="app-main">
            <!-- Sección de Estadísticas -->
            <section class="stats-grid">
                <div class="stat-card"><div class="stat-icon icon-reports"></div><div class="stat-content"><div id="totalReports" class="stat-number">0</div><div class="stat-label">Reportes Totales</div></div></div>
                <div class="stat-card"><div class="stat-icon icon-today"></div><div class="stat-content"><div id="todayReports" class="stat-number">0</div><div class="stat-label">Enviados Hoy</div></div></div>
                <div class="stat-card"><div class="stat-icon icon-executives"></div><div class="stat-content"><div id="executivesCount" class="stat-number">0</div><div class="stat-label">Ejecutivos Activos</div></div></div>
            </section>

            <!-- Sistema de Pestañas -->
            <ul class="nav nav-tabs main-tabs" id="myTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="reports-tab" data-bs-toggle="tab" data-bs-target="#reports-tab-pane" type="button" role="tab" aria-controls="reports-tab-pane" aria-selected="true"><i class="fas fa-list-alt me-2"></i>Lista de Reportes</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="compliance-tab" data-bs-toggle="tab" data-bs-target="#compliance-tab-pane" type="button" role="tab" aria-controls="compliance-tab-pane" aria-selected="false"><i class="fas fa-check-double me-2"></i>Cumplimiento Diario</button>
                </li>
            </ul>

            <div class="tab-content" id="myTabContent">
                <!-- Pestaña 1: Lista de Reportes -->
                <div class="tab-pane fade show active" id="reports-tab-pane" role="tabpanel" aria-labelledby="reports-tab" tabindex="0">
                    <section class="content-card">
                        <div class="filter-bar">
                            <div class="row g-2 g-md-3">
                                <div class="col-lg-3 col-md-6"><label for="filterExecutive" class="form-label">Ejecutivo</label><select id="filterExecutive" class="form-select"></select></div>
                                <div class="col-lg-3 col-md-4 col-6"><label for="filterStartDate" class="form-label">Desde</label><input type="date" id="filterStartDate" class="form-control"></div>
                                <div class="col-lg-3 col-md-4 col-6"><label for="filterEndDate" class="form-label">Hasta</label><input type="date" id="filterEndDate" class="form-control"></div>
                                <div class="col-lg-3 col-md-4 d-flex align-items-end gap-2 mt-2 mt-md-0">
                                    <button id="applyFilters" class="btn btn-dark w-100"><i class="fas fa-filter me-2"></i>Filtrar</button>
                                    <button id="clearFilters" class="btn btn-light w-100"><i class="fas fa-times me-2"></i>Limpiar</button>
                                </div>
                            </div>
                        </div>
                        <div id="dataTableContainer" class="table-responsive"></div>
                    </section>
                </div>
                <!-- Pestaña 2: Cumplimiento Diario -->
                <div class="tab-pane fade" id="compliance-tab-pane" role="tabpanel" aria-labelledby="compliance-tab" tabindex="0">
                    <section class="content-card">
                        <div class="compliance-header">
                            <h5 class="mb-0">Verificación de Cumplimiento</h5>
                            <div class="d-flex align-items-center gap-2">
                                <label for="compliance-date-filter" class="form-label mb-0">Fecha:</label>
                                <input type="date" id="compliance-date-filter" class="form-control" style="width: 180px;">
                            </div>
                        </div>
                        <div class="compliance-body">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="compliance-column">
                                        <h6 class="compliance-title">✅ Cumplieron (<span id="fulfilled-count">0</span>)</h6>
                                        <div id="compliance-fulfilled-list" class="compliance-list"></div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="compliance-column">
                                        <h6 class="compliance-title">❌ Pendientes (<span id="pending-count">0</span>)</h6>
                                        <div id="compliance-pending-list" class="compliance-list"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <!-- MODALS -->
    <div class="modal fade" id="reportModal" tabindex="-1" data-bs-backdrop="static"><div class="modal-dialog modal-xl modal-dialog-scrollable"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Registrar Actividad Diaria</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body p-4"><form id="reportForm" novalidate><input type="hidden" id="formCargo">            <div class="row g-3">
                <div class="col-md-6 mb-3"><label class="form-label">Ejecutivo</label><select id="formExecutive" class="form-select" required><option value="" selected disabled>Cargando...</option></select><small id="formCargoDisplay" class="text-muted"></small></div>
                <div class="col-md-6 mb-3"><label class="form-label">Fecha de Actividades</label><input type="date" class="form-control" id="fechaReporte" required></div>
                <div class="col-12 mb-3"><label class="form-label">Detalle de Actividades</label><div id="editor-container"></div></div>
                <div class="col-12 mt-4"><label class="form-label">Adjuntar Capturas (Máx. 5)</label><div id="image-drop-zone" tabindex="0" class="p-3 p-md-4 text-center"><p class="mb-0 text-muted"><i class="fas fa-cloud-upload-alt fa-2x"></i></p><p class="mb-0 text-muted small">Arrastra archivos o haz clic aquí</p></div><input type="file" id="imageUpload" multiple accept="image/*" class="d-none"><div id="image-preview" class="mt-3"></div></div>
            </div>
</form></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button><button type="button" id="saveButton" class="btn btn-primary"><i class="fas fa-save me-1"></i> Guardar Reporte</button></div></div></div></div>
    <div class="modal fade" id="spinnerModal" tabindex="-1" data-bs-backdrop="static"><div class="modal-dialog modal-dialog-centered"><div class="modal-content" style="background:transparent; border:none;"><div class="modal-body text-center py-5"><div class="spinner-border text-light" style="width:3rem;height:3rem"></div><p class="mt-3 mb-0 fs-5 text-light">Procesando...</p></div></div></div></div>
    <div class="modal fade" id="detailModal" tabindex="-1"><div class="modal-dialog modal-xl modal-dialog-scrollable"><div class="modal-content"><div class="modal-header"><div class="d-flex align-items-center w-100"><i class="fas fa-user-circle fa-3x text-muted me-3"></i><div><h6 id="detailEjecutivo" class="mb-0"></h6><small class="text-muted" id="detailCargo"></small></div><div class="ms-auto text-end"><small id="detailFecha" class="text-muted"></small></div></div><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body p-4 p-md-5"><h4 id="detailSubject" class="mb-4"></h4><div id="detailBody" class="ql-snow"><div class="ql-editor"></div></div><hr class="my-4"><div id="detailCommentSection" style="display: none;"><h6 class="mb-2"><i class="fas fa-comment-dots me-2"></i>Comentarios de Revisión</h6><p id="detailCommentText" class="p-3 rounded" style="background-color: #fffbe6; border-left: 4px solid #ffc107;"></p><hr class="my-4"></div><h6 class="mb-3"><i class="fas fa-paperclip me-2"></i>Archivos Adjuntos</h6><div id="detailAttachments"></div></div></div></div></div>
    <div class="modal fade" id="imagePreviewModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content bg-transparent border-0"><div class="modal-body p-0 text-center"><img src="" id="previewModalImage" class="img-fluid rounded"><button type="button" class="btn-close preview-close-btn" data-bs-dismiss="modal" aria-label="Close"></button></div></div></div></div>

    <!-- SCRIPTS -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="main.js"></script>
</body>
</html>
